<html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Gallery </title>
       <link rel="stylesheet" href="style.css">
        <style>
            @font-face {
                font-family: "InstrumentSerif-Italic";
                src: url("assets/fonts/InstrumentSerif-Italic.ttf");
              }
              @font-face {
                font-family: "InstrumentSerif-Regular";
                src: url("assets/fonts/InstrumentSerif-Regular.ttf");
              }
              body {
                background-image: url(assets/backgroundimage.jpg);
                background-size: cover;
                background-position: center;
                background-repeat: repeat;
                background-attachment: fixed;
              }
              .title {
                text-align: center;
              }
              .gallery {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 12px;
                padding: 12px;
              }
              
              .gallery img {
                width: 100%;
                height: auto;
                object-fit: cover;
                border: 1px solid black;
                image-rendering: pixelated;
              }
              .mochi {
                text-align: center;
              }
        </style>
      <body>
        <div class="title">
        <h1 style="font-family: 'InstrumentSerif-Italic'; color:azure;"> Gallery </h1>
        <div class="gallery">
          <img src="Gallery-images/nightride.png">
          <img src="Gallery-images/existentialdread.jpg"> <h4 style="font-family: 'InstrumentSerif-Regular'; color: azure;"> A picture that stuck to me. I wonder why.</h4>
        </div>
        </div>
      <div class="mochi">
        <a href="index.html">
          <img src="assets/Sakura Mochi.png" alt="mochi">
        </a>
      </div>  

      </body>

    </head>
</html>
